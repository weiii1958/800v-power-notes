<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="system-ui,-apple-system,'PingFang TC',sans-serif">
  <rect width="1000" height="320" fill="#0a0e17"/>
  <text x="500" y="36" text-anchor="middle" fill="#e5e7eb" font-size="20" font-weight="700">方案 B｜斷路器裝在哪</text>
  <text x="500" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">800V 母線 → Tap-off Box（內藏接觸器／MCCB／SSCB）→ 垂到運算櫃</text>

  <!-- bus -->
  <rect x="80" y="90" width="840" height="28" rx="6" fill="#22c55e"/>
  <text x="500" y="109" text-anchor="middle" fill="#052e16" font-size="14" font-weight="700">800V DC 母線</text>

  <!-- three tap-offs -->
  <g>
    <rect x="180" y="130" width="140" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="250" y="158" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="700">Tap-off Box</text>
    <text x="250" y="180" text-anchor="middle" fill="#94a3b8" font-size="11">內＝三種切斷之一</text>
    <line x1="250" y1="118" x2="250" y2="130" stroke="#22c55e" stroke-width="4"/>
    <line x1="250" y1="200" x2="250" y2="240" stroke="#64748b" stroke-width="3"/>
    <rect x="200" y="240" width="100" height="50" rx="6" fill="#111827" stroke="#34d399"/>
    <text x="250" y="270" text-anchor="middle" fill="#6ee7b7" font-size="12">運算櫃</text>
  </g>
  <g>
    <rect x="430" y="130" width="140" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="500" y="158" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="700">Tap-off Box</text>
    <text x="500" y="180" text-anchor="middle" fill="#fbbf24" font-size="11">故障 → 只切這支</text>
    <line x1="500" y1="118" x2="500" y2="130" stroke="#22c55e" stroke-width="4"/>
    <line x1="500" y1="200" x2="500" y2="240" stroke="#f87171" stroke-width="3"/>
    <rect x="450" y="240" width="100" height="50" rx="6" fill="#111827" stroke="#f87171"/>
    <text x="500" y="270" text-anchor="middle" fill="#fca5a5" font-size="12">故障櫃</text>
  </g>
  <g>
    <rect x="680" y="130" width="140" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="750" y="158" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="700">Tap-off Box</text>
    <text x="750" y="180" text-anchor="middle" fill="#94a3b8" font-size="11">內＝三種切斷之一</text>
    <line x1="750" y1="118" x2="750" y2="130" stroke="#22c55e" stroke-width="4"/>
    <line x1="750" y1="200" x2="750" y2="240" stroke="#64748b" stroke-width="3"/>
    <rect x="700" y="240" width="100" height="50" rx="6" fill="#111827" stroke="#34d399"/>
    <text x="750" y="270" text-anchor="middle" fill="#6ee7b7" font-size="12">運算櫃</text>
  </g>
  <text x="500" y="310" text-anchor="middle" fill="#64748b" font-size="12">示意／非實拍：盒子掛在母線上；切斷元件在盒子裡</text>
</svg>
