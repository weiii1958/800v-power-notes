<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="system-ui,-apple-system,'PingFang TC','Noto Sans TC',sans-serif">
  <rect width="1080" height="560" fill="#0a0e17"/>
  <text x="540" y="30" text-anchor="middle" fill="#e5e7eb" font-size="20" font-weight="700">跟「800V 供電」的關聯：近 → 遠</text>
  <text x="540" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">只列機制較貼、原文有掛名的；純度不夠的不硬塞。非報酬預測。</text>

  <line x1="60" y1="82" x2="1020" y2="82" stroke="#334155" stroke-width="3"/>
  <polygon points="1020,82 1002,74 1002,90" fill="#334155"/>
  <text x="60" y="72" fill="#34d399" font-size="12" font-weight="700">近（A 出貨）</text>
  <text x="1020" y="72" text-anchor="end" fill="#64748b" font-size="12" font-weight="700">遠（B／C／規格）</text>

  <!-- ===== 近 ===== -->
  <rect x="24" y="100" width="340" height="400" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="194" y="128" text-anchor="middle" fill="#6ee7b7" font-size="15" font-weight="800">近｜高關聯</text>
  <text x="194" y="148" text-anchor="middle" fill="#a7f3d0" font-size="11">Option A：轉電櫃＋800V 配線</text>

  <text x="44" y="178" fill="#e2e8f0" font-size="13" font-weight="700">電源系統（AC↔800V／54V Shelf）</text>
  <text x="44" y="200" fill="#cbd5e1" font-size="12">台達電 · 光寶科 · Vertiv（VRT）</text>
  <text x="44" y="218" fill="#94a3b8" font-size="11">Power Rack：AC→800V PSU；運算櫃：800→54V</text>
  <text x="44" y="236" fill="#94a3b8" font-size="11">台達另有 Meta ±400 專案（延燒／少量出貨敘事）</text>

  <text x="44" y="270" fill="#e2e8f0" font-size="13" font-weight="700">高壓線束／連接器（Power Whip）</text>
  <text x="44" y="292" fill="#cbd5e1" font-size="12">Amphenol · 貿聯-KY</text>
  <text x="44" y="310" fill="#94a3b8" font-size="11">AC／800VDC Whip：高壓 DC 線束＋連接器</text>

  <text x="194" y="470" text-anchor="middle" fill="#34d399" font-size="12">先認這一檔</text>

  <!-- ===== 中 ===== -->
  <rect x="380" y="100" width="320" height="400" rx="12" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="540" y="128" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="800">中｜衛星</text>
  <text x="540" y="148" text-anchor="middle" fill="#bfdbfe" font-size="11">跟櫃一起搬；非轉電本體</text>

  <text x="400" y="178" fill="#e2e8f0" font-size="13" font-weight="700">BBU／短備援</text>
  <text x="400" y="200" fill="#cbd5e1" font-size="12">Panasonic · 順達 · 新盛力 · AES-KY</text>
  <text x="400" y="218" fill="#94a3b8" font-size="11">Power Rack Shelf 選配；約 60 秒緩衝</text>
  <text x="400" y="236" fill="#94a3b8" font-size="11">新盛力：文內掛台達 Meta 案 25kW BBU</text>

  <text x="400" y="270" fill="#e2e8f0" font-size="13" font-weight="700">電容（PSU／BBU 內）</text>
  <text x="400" y="292" fill="#cbd5e1" font-size="12">牛角：Chemi-con · Nichicon · Rubycon</text>
  <text x="400" y="310" fill="#cbd5e1" font-size="12">　　　金山電 · 立隆電</text>
  <text x="400" y="328" fill="#cbd5e1" font-size="12">薄膜：Kemet · Panasonic</text>
  <text x="400" y="346" fill="#cbd5e1" font-size="12">NP0 MLCC：禾伸堂 · TDK</text>
  <text x="400" y="364" fill="#94a3b8" font-size="11">名單廣、通用料；勿跟電源廠同信心</text>

  <text x="540" y="470" text-anchor="middle" fill="#60a5fa" font-size="12">衛星，勿跟近端同檔</text>

  <!-- ===== 遠 ===== -->
  <rect x="716" y="100" width="340" height="400" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="886" y="128" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="800">遠｜觀察／長線</text>
  <text x="886" y="148" text-anchor="middle" fill="#94a3b8" font-size="11">時程更後，或不是機櫃 BOM 主菜</text>

  <text x="736" y="178" fill="#e2e8f0" font-size="13" font-weight="700">B｜高壓 DC 切斷</text>
  <text x="736" y="200" fill="#cbd5e1" font-size="12">松川精密</text>
  <text x="736" y="218" fill="#94a3b8" font-size="11">高壓 DC 繼電器／接觸器；看導入進度</text>
  <text x="736" y="236" fill="#94a3b8" font-size="11">（B 的 MCCB／SSCB 本身未點名廠商）</text>

  <text x="736" y="270" fill="#e2e8f0" font-size="13" font-weight="700">C｜SST 長線</text>
  <text x="736" y="292" fill="#cbd5e1" font-size="12">台達電（SST 那一腿）</text>
  <text x="736" y="310" fill="#94a3b8" font-size="11">≠ 近端 Power Rack；量產線約 2027Q1 量級</text>

  <text x="736" y="344" fill="#e2e8f0" font-size="13" font-weight="700">規格／拉貨</text>
  <text x="736" y="366" fill="#cbd5e1" font-size="12">NVIDIA · Meta</text>
  <text x="736" y="384" fill="#94a3b8" font-size="11">定架構／菜單；自己不賣那顆 PSU</text>

  <text x="886" y="470" text-anchor="middle" fill="#94a3b8" font-size="12">地圖用，非近端主菜</text>

  <text x="540" y="534" text-anchor="middle" fill="#64748b" font-size="11">示意／非投資建議 · SiC 元件廠、機房電巨頭等未點名者不列</text>
</svg>
