<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" font-family="system-ui,-apple-system,'PingFang TC',sans-serif">
  <rect width="960" height="280" fill="#0a0e17"/>
  <text x="480" y="36" text-anchor="middle" fill="#e5e7eb" font-size="22" font-weight="700">尺度：現在從「百 kW 機櫃」往「MW 機房」爬</text>
  <text x="480" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">功率變大 → 供電架構才從 A 拉到 B、再想到 C</text>

  <!-- arrow baseline -->
  <line x1="80" y1="200" x2="880" y2="200" stroke="#475569" stroke-width="3"/>
  <polygon points="880,200 860,190 860,210" fill="#475569"/>

  <!-- A -->
  <rect x="90" y="100" width="200" height="88" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="190" y="132" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="700">A｜機櫃級</text>
  <text x="190" y="158" text-anchor="middle" fill="#e0f2fe" font-size="20" font-weight="800">數百 kW</text>
  <text x="190" y="178" text-anchor="middle" fill="#94a3b8" font-size="12">例：Power Rack ≈660kW</text>
  <text x="190" y="230" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">近端（Rubin）</text>

  <!-- B -->
  <rect x="380" y="88" width="200" height="100" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="480" y="120" text-anchor="middle" fill="#6ee7b7" font-size="18" font-weight="700">B｜叢集級</text>
  <text x="480" y="148" text-anchor="middle" fill="#d1fae5" font-size="20" font-weight="800">MW 級</text>
  <text x="480" y="170" text-anchor="middle" fill="#94a3b8" font-size="12">Power Center 餵一排</text>
  <text x="480" y="230" text-anchor="middle" fill="#34d399" font-size="13" font-weight="600">中長期（約2027Q3試點）</text>

  <!-- C -->
  <rect x="670" y="72" width="220" height="116" rx="12" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="780" y="108" text-anchor="middle" fill="#fde68a" font-size="18" font-weight="700">C｜資料中心級</text>
  <text x="780" y="138" text-anchor="middle" fill="#fef3c7" font-size="18" font-weight="800">數 MW → 往 GW</text>
  <text x="780" y="162" text-anchor="middle" fill="#94a3b8" font-size="12">整廳；Power Block≈4.8MW／座</text>
  <text x="780" y="230" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">更長遠</text>

  <text x="480" y="262" text-anchor="middle" fill="#64748b" font-size="12">示意／非實拍：不是三選一互斥，是功率尺度變大時，架構往上搬</text>
</svg>
