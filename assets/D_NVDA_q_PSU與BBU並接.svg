<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" font-family="system-ui,-apple-system,'PingFang TC','Noto Sans TC',sans-serif">
  <rect width="1080" height="520" fill="#0a0e17"/>

  <text x="540" y="36" text-anchor="middle" fill="#e5e7eb" font-size="22" font-weight="700">PSU 與 BBU＝並接在同一條 800V 母線</text>
  <text x="540" y="62" text-anchor="middle" fill="#94a3b8" font-size="14">斷電時電池直接頂母線，不經過 PSU</text>

  <!-- ========== LEFT: normal ========== -->
  <rect x="36" y="88" width="490" height="400" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
  <text x="281" y="122" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="700">平常（有市電）</text>

  <!-- AC -->
  <rect x="70" y="160" width="64" height="36" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="102" y="183" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">AC</text>
  <!-- line AC to PSU -->
  <line x1="134" y1="178" x2="196" y2="178" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="196,170 214,178 196,186" fill="#94a3b8"/>

  <!-- PSU -->
  <rect x="214" y="152" width="100" height="52" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="264" y="184" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="700">PSU</text>
  <text x="264" y="140" text-anchor="middle" fill="#64748b" font-size="12">轉電（AC→800V）</text>

  <!-- vertical down to bus -->
  <line x1="264" y1="204" x2="264" y2="268" stroke="#22d3ee" stroke-width="4"/>
  <polygon points="256,268 264,286 272,268" fill="#22d3ee"/>

  <!-- BUS -->
  <rect x="70" y="286" width="380" height="44" rx="8" fill="#0e7490"/>
  <text x="260" y="314" text-anchor="middle" fill="#ecfeff" font-size="16" font-weight="700">800V DC 母線</text>

  <!-- out to rack -->
  <line x1="450" y1="308" x2="480" y2="308" stroke="#34d399" stroke-width="4"/>
  <polygon points="480,298 500,308 480,318" fill="#34d399"/>
  <text x="455" y="290" fill="#6ee7b7" font-size="13">往運算櫃</text>

  <!-- charge down to BBU -->
  <line x1="360" y1="330" x2="360" y2="380" stroke="#fbbf24" stroke-width="3"/>
  <polygon points="352,380 360,396 368,380" fill="#fbbf24"/>
  <rect x="310" y="400" width="100" height="52" rx="10" fill="#422006" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="360" y="432" text-anchor="middle" fill="#fcd34d" font-size="18" font-weight="700">BBU</text>
  <text x="420" y="430" fill="#94a3b8" font-size="13">充電</text>

  <text x="281" y="470" text-anchor="middle" fill="#64748b" font-size="13">供電路徑：AC → PSU → 母線 → 運算櫃</text>

  <!-- ========== RIGHT: outage ========== -->
  <rect x="554" y="88" width="490" height="400" rx="16" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
  <text x="799" y="122" text-anchor="middle" fill="#fcd34d" font-size="18" font-weight="700">斷電（市電沒了）</text>

  <!-- AC dead -->
  <rect x="588" y="160" width="64" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="620" y="183" text-anchor="middle" fill="#64748b" font-size="14" font-weight="600">AC</text>
  <line x1="598" y1="168" x2="642" y2="188" stroke="#ef4444" stroke-width="3"/>
  <line x1="642" y1="168" x2="598" y2="188" stroke="#ef4444" stroke-width="3"/>

  <line x1="652" y1="178" x2="714" y2="178" stroke="#475569" stroke-width="3" stroke-dasharray="6 5"/>

  <!-- PSU idle -->
  <rect x="732" y="152" width="100" height="52" rx="10" fill="#1f2937" stroke="#475569" stroke-width="2.5"/>
  <text x="782" y="184" text-anchor="middle" fill="#64748b" font-size="18" font-weight="700">PSU</text>
  <text x="782" y="140" text-anchor="middle" fill="#64748b" font-size="12">停工</text>

  <!-- dashed vertical no flow -->
  <line x1="782" y1="204" x2="782" y2="286" stroke="#475569" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="800" y="250" fill="#ef4444" font-size="12">不經 PSU</text>

  <!-- BUS -->
  <rect x="588" y="286" width="380" height="44" rx="8" fill="#0e7490"/>
  <text x="778" y="314" text-anchor="middle" fill="#ecfeff" font-size="16" font-weight="700">800V DC 母線</text>

  <!-- out -->
  <line x1="968" y1="308" x2="998" y2="308" stroke="#34d399" stroke-width="4"/>
  <polygon points="998,298 1018,308 998,318" fill="#34d399"/>
  <text x="970" y="290" fill="#6ee7b7" font-size="13">往運算櫃</text>

  <!-- BBU discharge UP -->
  <rect x="828" y="400" width="100" height="52" rx="10" fill="#422006" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="878" y="432" text-anchor="middle" fill="#fcd34d" font-size="18" font-weight="700">BBU</text>
  <line x1="878" y1="400" x2="878" y2="340" stroke="#fbbf24" stroke-width="4"/>
  <polygon points="870,340 878,322 886,340" fill="#fbbf24"/>
  <text x="900" y="370" fill="#fde68a" font-size="13">放電</text>

  <text x="799" y="470" text-anchor="middle" fill="#64748b" font-size="13">備援路徑：BBU → 母線 → 運算櫃（約 60 秒）</text>
</svg>